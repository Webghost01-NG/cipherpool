services:
  backend-relayer:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - RPC_URL=${RPC_URL}
      - DATABASE_URL=${DATABASE_URL}
      - CHAIN_ID=11155111
      - POOL_CONTRACT_ADDRESS=${POOL_CONTRACT_ADDRESS}
      - RELAYER_URL=${RELAYER_URL:-}
      - INDEXER_START_BLOCK=${INDEXER_START_BLOCK}
      - INDEXER_BLOCK_BATCH_SIZE=${INDEXER_BLOCK_BATCH_SIZE:-500}
      - POLL_INTERVAL_MS=3000
      - MAX_RETRIES=5
    restart: unless-stopped
