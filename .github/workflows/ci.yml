name: CipherPool CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Foundry Smart Contracts Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --prefer-offline --no-audit

      - name: Foundry Test Suite
        run: forge test -vv

  backend-and-client:
    name: Backend & Client Adapters Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --prefer-offline --no-audit

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Backend Test Suite
        run: npm run test:backend

      - name: Client Adapters Test Suite
        run: npm run test:client

  frontend:
    name: Frontend UX & QA Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --prefer-offline --no-audit

      - name: Frontend Component Test Suite
        run: npm run test:frontend

      - name: Production Vite Build
        run: npm run build:frontend
